<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b5bd6">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ролевой чат</title>
<style>
:root{--bg:#f4f4f7;--card:#fff;--text:#161616;--muted:#7a7a80;--accent:#5b5bd6;--theirs:#e8e8ee;--line:#0001}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1d1d20;--text:#f2f2f4;--muted:#9a9aa2;--theirs:#2a2a2f;--line:#fff1}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:16px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.bar h1{font-size:18px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll{flex:1;overflow:auto;padding:14px;-webkit-overflow-scrolling:touch}
button{font:inherit;border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.5}
button.ghost{background:none;color:var(--accent);padding:8px}
button.wide{width:100%;margin-top:6px}
button.small{padding:6px 10px;font-size:14px}
input,textarea{font:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
textarea{min-height:90px;resize:vertical}
.muted{color:var(--muted);font-size:14px}
.center{text-align:center;margin-top:40px}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px;margin-bottom:10px;cursor:pointer}
.card .info{flex:1;min-width:0;display:flex;flex-direction:column}
.card .info span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .x{background:none;color:var(--muted);padding:6px}
.avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:none;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.avatar.sm{width:36px;height:36px;font-size:15px}
.msg{max-width:82%;padding:10px 13px;border-radius:18px;margin-bottom:8px;white-space:pre-wrap;word-wrap:break-word;line-height:1.4}
.msg.user{margin-left:auto;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.msg.assistant{background:var(--theirs);border-bottom-left-radius:5px}
.inputbar{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
.inputbar textarea{min-height:44px;max-height:120px;flex:1;resize:none}
.inputbar button{border-radius:12px;padding:0 18px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:420px;max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;font-size:18px}
.row{display:flex;gap:8px}
.row>*{flex:1}
#preview{width:96px;height:96px;border-radius:14px;object-fit:cover;align-self:center}
#status{font-size:14px;min-height:20px}
</style>
</head>
<body>

<div id="app" class="screen"></div>

<div id="chat" class="screen" hidden>
  <div class="bar">
    <button class="ghost" onclick="closeChat()">‹ Назад</button>
    <span id="cavatar"></span>
    <h1 id="cname"></h1>
  </div>
  <div class="scroll" id="msgs"></div>
  <div class="inputbar">
    <textarea id="draft" rows="1" placeholder="Сообщение"></textarea>
    <button id="sendBtn" onclick="sendMsg()">→</button>
  </div>
</div>

<div id="formModal" class="modal" hidden>
  <div class="sheet">
    <h2>Новый персонаж</h2>
    <input id="fName" placeholder="Имя">
    <textarea id="fTraits" placeholder="Характер: как говорит, что любит, как реагирует на людей"></textarea>
    <input id="fPhoto" type="file" accept="image/*">
    <img id="preview" hidden alt="">
    <div class="row">
      <button class="ghost" onclick="closeForm()">Отмена</button>
      <button onclick="addChar()">Создать</button>
    </div>
  </div>
</div>

<div id="setModal" class="modal" hidden>
  <div class="sheet">
    <h2>Ключ Groq</h2>
    <p class="muted">Ключ начинается с gsk_. Хранится только в этом телефоне.</p>
    <input id="keyInput" type="password" placeholder="gsk_...">
    <div class="row">
      <button class="ghost" onclick="closeSettings()">Закрыть</button>
      <button onclick="saveKey()">Сохранить</button>
    </div>
    <button class="small" onclick="testKey()">Проверить ключ</button>
    <div id="status"></div>
    <p class="muted">Версия: <b>Groq v3</b></p>
  </div>
</div>

<script>
const VERSION = "Groq v3";
const MODEL = "llama-3.1-8b-instant";
const STORE = "rp_app_v3";

let db = load();
let ui = {chatId: null, draft: "", busy: false};

function load(){
  try {
    const d = JSON.parse(localStorage.getItem(STORE));
    if (d && Array.isArray(d.characters)) return d;
  } catch (e) {}
  return {characters: [], chats: {}, key: ""};
}
function save(){
  try { localStorage.setItem(STORE, JSON.stringify(db)); return true; }
  catch (e) { alert("Мало места в браузере. Удали часть персонажей с фото."); return false; }
}
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function findChar(id){ return db.characters.find(c => c.id === id); }

function avatar(c, cls){
  if (c.photo) return `<img class="avatar ${cls || ""}" src="${c.photo}" alt="">`;
  return `<div class="avatar ${cls || ""}">${esc(c.name.charAt(0).toUpperCase())}</div>`;
}

function compress(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 384, s = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * s);
        canvas.height = Math.round(img.height * s);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- Список персонажей ----------
let pendingPhoto = "";

function render(){
  const cards = db.characters.map(c => `
    <div class="card" onclick="openChat('${c.id}')">
      ${avatar(c)}
      <div class="info"><b>${esc(c.name)}</b><span>${esc(c.traits)}</span></div>
      <button class="x" onclick="event.stopPropagation();delChar('${c.id}')">✕</button>
    </div>`).join("");
  $("app").innerHTML = `
    <div class="bar"><h1>Персонажи</h1><button class="ghost" onclick="openSettings()">⚙</button></div>
    <div class="scroll">
      ${cards || '<p class="muted center">Персонажей пока нет. Нажми «+ Новый персонаж».</p>'}
      <button class="wide" onclick="showForm()">+ Новый персонаж</button>
    </div>`;
}

function showForm(){
  pendingPhoto = "";
  $("fName").value = ""; $("fTraits").value = ""; $("fPhoto").value = "";
  $("preview").hidden = true; $("preview").removeAttribute("src");
  $("formModal").hidden = false;
}
function closeForm(){ $("formModal").hidden = true; }

$("fPhoto").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  pendingPhoto = await compress(f);
  $("preview").src = pendingPhoto;
  $("preview").hidden = false;
});

function addChar(){
  const name = $("fName").value.trim();
  const traits = $("fTraits").value.trim();
  if (!name || !traits){ alert("Заполни имя и характер"); return; }
  const c = {id: newId(), name, traits, photo: pendingPhoto};
  db.characters.push(c);
  db.chats[c.id] = [];
  if (!save()) return;
  closeForm();
  render();
}

function delChar(id){
  const c = findChar(id);
  if (!c || !confirm(`Удалить «${c.name}» и переписку?`)) return;
  db.characters = db.characters.filter(x => x.id !== id);
  delete db.chats[id];
  save();
  render();
}

// ---------- Чат ----------
function openChat(id){
  ui.chatId = id;
  $("app").hidden = true;
  $("chat").hidden = false;
  renderChat();
  $("draft").value = "";
}

function closeChat(){
  ui.chatId = null;
  $("chat").hidden = true;
  $("app").hidden = false;
  render();
}

function renderChat(){
  const c = findChar(ui.chatId);
  if (!c){ closeChat(); return; }
  $("cavatar").innerHTML = avatar(c, "sm");
  $("cname").textContent = c.name;
  const msgs = db.chats[c.id] || [];
  $("msgs").innerHTML = msgs.length
    ? msgs.map(m => `<div class="msg ${m.role}">${esc(m.text)}</div>`).join("")
    : '<p class="muted center">Напиши первое сообщение.</p>';
  $("msgs").scrollTop = $("msgs").scrollHeight;
}

$("draft").addEventListener("input", e => { ui.draft = e.target.value; });

function buildPrompt(c){
  return `Ты играешь роль персонажа по имени ${c.name}. Характер и манера речи: ${c.traits}. ` +
    `Оставайся в роли, говори от первого лица, отвечай коротко (1–4 предложения) и на языке собеседника.`;
}

async function sendMsg(){
  const c = findChar(ui.chatId);
  const text = $("draft").value.trim();
  if (!c || !text || ui.busy) return;

  const hist = db.chats[c.id] || (db.chats[c.id] = []);
  hist.push({role: "user", text});
  $("draft").value = "";
  save();
  renderChat();

  ui.busy = true;
  $("sendBtn").disabled = true;
  const reply = await getReply(c, hist.slice());
  hist.push({role: "assistant", text: reply});
  save();
  ui.busy = false;
  $("sendBtn").disabled = false;
  if (ui.chatId === c.id) renderChat();
}

async function getReply(c, hist){
  const key = checkKey();
  if (key.error) return "⚠ " + key.error;
  const messages = [{role: "system", content: buildPrompt(c)}]
    .concat(hist.map(m => ({role: m.role, content: m.text})));
  try {
    return await callGroq(key.value, messages, 400);
  } catch (e) {
    return "⚠ " + e.message;
  }
}

// ---------- Ключ и запрос к Groq ----------
function checkKey(){
  const k = (db.key || "").trim();
  if (!k) return {error: "Ключ не введён. Нажми ⚙ и вставь ключ Groq."};
  if (!k.startsWith("gsk_")) return {error: "Сохранён неверный ключ. Ключ Groq начинается с gsk_, а не sk-ant. Открой ⚙ и вставь ключ с console.groq.com."};
  return {value: k};
}

async function callGroq(key, messages, maxTokens){
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {"Content-Type": "application/json", "Authorization": "Bearer " + key},
    body: JSON.stringify({model: db.model || MODEL, messages, max_tokens: maxTokens})
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok){
    const msg = (data.error && data.error.message) || ("код ошибки " + res.status);
    throw new Error(msg);
  }
  const text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  return (text || "").trim() || "(пустой ответ)";
}

function openSettings(){
  $("keyInput").value = db.key || "";
  $("status").textContent = "";
  $("setModal").hidden = false;
}
function closeSettings(){ $("setModal").hidden = true; }

function saveKey(){
  db.key = $("keyInput").value.trim();
  if (!save()) return;
  $("status").textContent = db.key ? "Ключ сохранён." : "Ключ удалён.";
}

async function testKey(){
  const key = checkKey();
  if (key.error){ $("status").textContent = "⚠ " + key.error; return; }
  $("status").textContent = "Проверяю и ищу доступную модель...";
  try {
    const res = await fetch("https://api.groq.com/openai/v1/models", {
      headers: {"Authorization": "Bearer " + key.value}
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((data.error && data.error.message) || ("код ошибки " + res.status));

    const ids = (data.data || []).map(m => m.id);
    const chatIds = ids.filter(id => !/whisper|guard|tts|embed|vision/i.test(id));
    const preferred = chatIds.find(id => /llama/i.test(id) && /instant|versatile|scout|70b|8b/i.test(id))
      || chatIds.find(id => /llama/i.test(id))
      || chatIds[0];
    if (!preferred) throw new Error("на ключе нет доступных чат-моделей");

    db.model = preferred;
    save();
    $("status").textContent = "✅ Ключ работает. Выбрана модель: " + preferred + ". Можно писать персонажу.";
  } catch (e) {
    $("status").textContent = "⚠ Ошибка: " + e.message;
  }
}

render();
</script>
</body>
</html>
