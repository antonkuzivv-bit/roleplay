<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Чат</title>
<style>
:root{--bg:#000;--panel:#0c0c0c;--card:#111;--line:#1f1f1f;--text:#e6e6e6;--muted:#737373;--btn:#161616;--btn2:#202020;--mine:#1c1c1c;--theirs:#0f0f0f}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,system-ui,"Segoe UI",sans-serif;font-size:15px;letter-spacing:.1px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.bar h1{font-size:16px;font-weight:500;margin:0;flex:1}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.ttl b{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{color:var(--muted);font-size:12px}
.scroll{flex:1;overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--btn);color:var(--text);cursor:pointer}
button:disabled{opacity:.4}
button.ghost{background:none;border-color:transparent;color:var(--muted);padding:8px 6px}
button.wide{width:100%;margin-top:8px;background:var(--btn2)}
button.small{font-size:13px;padding:8px 12px}
button.primary{background:var(--text);border-color:var(--text);color:#000}
input,textarea,select{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);outline:none}
input:focus,textarea:focus,select:focus{border-color:#333}
textarea{min-height:86px;resize:vertical}
.muted{color:var(--muted);font-size:13px;margin:0}
.center{text-align:center;margin-top:48px}
.card{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.card .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.card .info small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .x{border:none;background:none;color:var(--muted);padding:6px}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:#1a1a1a;color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:18px;filter:grayscale(.6)}
.avatar.sm{width:32px;height:32px;font-size:14px}
.msg{max-width:84%;padding:10px 13px;border-radius:14px;margin-bottom:8px;white-space:pre-wrap;word-wrap:break-word;line-height:1.45;border:1px solid var(--line)}
.msg.user{margin-left:auto;background:var(--mine)}
.msg.assistant{background:var(--theirs)}
.inputbar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--bg)}
.inputbar textarea{min-height:44px;max-height:120px;flex:1;resize:none}
.inputbar button{padding:0 16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;font-size:16px;font-weight:500}
.row{display:flex;gap:8px}
.row>*{flex:1}
#preview{width:88px;height:88px;border-radius:12px;object-fit:cover;align-self:center;filter:grayscale(.6)}
#sStatus{font-size:13px;color:var(--muted);min-height:18px;word-break:break-word}
.lbl{font-size:12px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>

<div id="app" class="screen"></div>

<div id="chat" class="screen" hidden>
  <div class="bar">
    <button class="ghost" onclick="closeChat()">←</button>
    <span id="cavatar"></span>
    <div class="ttl"><b id="cname"></b><small id="cmeta"></small></div>
  </div>
  <div class="scroll" id="msgs"></div>
  <div class="inputbar">
    <textarea id="draft" rows="1" placeholder="Сообщение"></textarea>
    <button id="sendBtn" onclick="sendMsg()">→</button>
  </div>
</div>

<div id="formModal" class="modal" hidden>
  <div class="sheet">
    <h2>Новый персонаж</h2>
    <input id="fName" placeholder="Имя">
    <input id="fAge" type="number" min="18" max="99" placeholder="Возраст (от 18)">
    <input id="fLocation" placeholder="Локация (город, место)">
    <select id="fTone">
      <option value="calm">Тон: обычный</option>
      <option value="friendly">Тон: дружеский</option>
      <option value="romantic">Тон: романтичный, без пошлости</option>
    </select>
    <textarea id="fTraits" placeholder="Характер: как говорит, что любит, как реагирует"></textarea>
    <input id="fPhoto" type="file" accept="image/*">
    <img id="preview" hidden alt="">
    <div class="row">
      <button onclick="closeForm()">Отмена</button>
      <button class="primary" onclick="addChar()">Создать</button>
    </div>
  </div>
</div>

<div id="setModal" class="modal" hidden>
  <div class="sheet">
    <h2>Настройки ИИ</h2>
    <div class="lbl">Сервис</div>
    <select id="sProvider"></select>
    <p class="muted" id="sHint"></p>
    <div class="lbl">Ключ API</div>
    <input id="sKey" type="password" placeholder="Вставь ключ">
    <div class="lbl">Модель</div>
    <input id="sModel" placeholder="">
    <div id="sUrlWrap" hidden>
      <div class="lbl">Адрес запроса (для своего сервера)</div>
      <input id="sUrl" placeholder="https://.../v1/chat/completions">
    </div>
    <div class="row">
      <button onclick="closeSettings()">Закрыть</button>
      <button class="primary" onclick="saveSettings()">Сохранить</button>
    </div>
    <button class="small" onclick="testSettings()">Проверить подключение</button>
    <div id="sStatus"></div>
  </div>
</div>

<script>
// ---------- Сервисы ----------
const P = {
  gemini:     {name: "Google Gemini", fmt: "gemini",    url: "",                                            def: "gemini-2.5-flash",   hint: "Есть бесплатный тариф. Ключ получи на aistudio.google.com (начинается с AIza)."},
  groq:       {name: "Groq",          fmt: "openai",    url: "https://api.groq.com/openai/v1/chat/completions", def: "openai/gpt-oss-120b", hint: "Есть бесплатный тариф. Ключ на console.groq.com (начинается с gsk_). Список моделей смотри там же."},
  openrouter: {name: "OpenRouter",    fmt: "openai",    url: "https://openrouter.ai/api/v1/chat/completions", def: "meta-llama/llama-3.3-70b-instruct:free", hint: "Есть бесплатные модели с суффиксом :free. Ключ на openrouter.ai (начинается с sk-or-)."},
  openai:     {name: "OpenAI (ChatGPT)", fmt: "openai", url: "https://api.openai.com/v1/chat/completions",  def: "gpt-4o-mini",        hint: "Платный. Ключ на platform.openai.com (начинается с sk-). Нужно пополнить баланс."},
  anthropic:  {name: "Anthropic (Claude)", fmt: "anthropic", url: "https://api.anthropic.com/v1/messages",  def: "claude-haiku-5-5",   hint: "Платный. Ключ на console.anthropic.com (начинается с sk-ant-)."},
  deepseek:   {name: "DeepSeek",      fmt: "openai",    url: "https://api.deepseek.com/chat/completions",   def: "deepseek-chat",      hint: "Платный, очень дешёвый. Ключ на platform.deepseek.com."},
  custom:     {name: "Свой сервер",   fmt: "openai",    url: "",                                            def: "",                   hint: "Любой сервис, совместимый с OpenAI. Укажи адрес запроса и название модели."}
};

// ---------- Данные ----------
const STORE = "rp_app_v4";
let db = load();
let ui = {chatId: null, busy: false};

function emptyDb(){ return {provider: "gemini", keys: {}, models: {}, customUrl: "", characters: [], chats: {}}; }
function load(){
  try { const d = JSON.parse(localStorage.getItem(STORE)); if (d && Array.isArray(d.characters)) return d; } catch (e) {}
  // миграция из прошлой версии (Groq)
  try {
    const old = JSON.parse(localStorage.getItem("rp_app_v3"));
    if (old && Array.isArray(old.characters)){
      const d = emptyDb();
      d.provider = "groq";
      d.keys.groq = old.key || "";
      d.characters = old.characters;
      d.chats = old.chats || {};
      return d;
    }
  } catch (e) {}
  return emptyDb();
}
function save(){
  try { localStorage.setItem(STORE, JSON.stringify(db)); return true; }
  catch (e) { alert("Мало места в браузере. Удали часть персонажей с фото."); return false; }
}

// ---------- Вспомогательное ----------
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function findChar(id){ return db.characters.find(c => c.id === id); }
function avatar(c, cls){
  if (c.photo) return `<img class="avatar ${cls || ""}" src="${c.photo}" alt="">`;
  return `<div class="avatar ${cls || ""}">${esc((c.name || "?").charAt(0).toUpperCase())}</div>`;
}
function compress(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 384, s = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * s); canvas.height = Math.round(img.height * s);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = reject; img.src = reader.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

// ---------- Список персонажей ----------
let pendingPhoto = "";

function render(){
  const cards = db.characters.map(c => `
    <div class="card" onclick="openChat('${c.id}')">
      ${avatar(c)}
      <div class="info"><b style="font-weight:500">${esc(c.name)}${c.age ? ", " + c.age : ""}</b><small>${esc(c.location || c.traits || "")}</small></div>
      <button class="x" onclick="event.stopPropagation();delChar('${c.id}')">✕</button>
    </div>`).join("");
  $("app").innerHTML = `
    <div class="bar"><h1>Персонажи</h1><button class="ghost" onclick="openSettings()">Настройки</button></div>
    <div class="scroll">
      ${cards || '<p class="muted center">Персонажей пока нет</p>'}
      <button class="wide" onclick="showForm()">Новый персонаж</button>
    </div>`;
}

function showForm(){
  pendingPhoto = "";
  ["fName","fAge","fLocation","fTraits","fPhoto"].forEach(id => $(id).value = "");
  $("fTone").value = "calm";
  $("preview").hidden = true; $("preview").removeAttribute("src");
  $("formModal").hidden = false;
}
function closeForm(){ $("formModal").hidden = true; }

$("fPhoto").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  pendingPhoto = await compress(f);
  $("preview").src = pendingPhoto; $("preview").hidden = false;
});

function addChar(){
  const name = $("fName").value.trim();
  const traits = $("fTraits").value.trim();
  const age = parseInt($("fAge").value, 10);
  const location = $("fLocation").value.trim();
  const tone = $("fTone").value;
  if (!name || !traits){ alert("Заполни имя и характер"); return; }
  if (!age || age < 18){ alert("Возраст персонажа должен быть 18 лет или больше"); return; }
  const c = {id: newId(), name, traits, age, location, tone, photo: pendingPhoto};
  db.characters.push(c);
  db.chats[c.id] = [];
  if (!save()) return;
  closeForm(); render();
}

function delChar(id){
  const c = findChar(id);
  if (!c || !confirm(`Удалить «${c.name}» и переписку?`)) return;
  db.characters = db.characters.filter(x => x.id !== id);
  delete db.chats[id];
  save(); render();
}

// ---------- Чат ----------
function openChat(id){
  ui.chatId = id;
  $("app").hidden = true; $("chat").hidden = false;
  $("draft").value = "";
  renderChat();
}
function closeChat(){
  ui.chatId = null;
  $("chat").hidden = true; $("app").hidden = false;
  render();
}
function renderChat(){
  const c = findChar(ui.chatId);
  if (!c){ closeChat(); return; }
  $("cavatar").innerHTML = avatar(c, "sm");
  $("cname").textContent = c.name;
  $("cmeta").textContent = [c.location, P[db.provider] ? P[db.provider].name : ""].filter(Boolean).join(" · ");
  const msgs = db.chats[c.id] || [];
  $("msgs").innerHTML = msgs.length
    ? msgs.map(m => `<div class="msg ${m.role}">${esc(m.text)}</div>`).join("")
    : '<p class="muted center">Напиши первое сообщение</p>';
  $("msgs").scrollTop = $("msgs").scrollHeight;
}

function buildPrompt(c){
  const tones = {
    calm: "Общение спокойное и обычное, без флирта.",
    friendly: "Общение дружелюбное и тёплое.",
    romantic: "Можно лёгкий романтический флирт. Никакой пошлости и откровенных описаний."
  };
  const facts = [`Возраст: ${c.age || "взрослый"}`];
  if (c.location) facts.push(`Локация: ${c.location}`);
  return `Ты играешь роль персонажа по имени ${c.name}. Характер и манера речи: ${c.traits}. ` +
    facts.join(". ") + ". " + (tones[c.tone] || tones.calm) + " " +
    "Оставайся в роли, говори от первого лица, пиши живо и осмысленно, отвечай на языке собеседника. Обычно 2–5 предложений.";
}

async function sendMsg(){
  const c = findChar(ui.chatId);
  const text = $("draft").value.trim();
  if (!c || !text || ui.busy) return;
  const hist = db.chats[c.id] || (db.chats[c.id] = []);
  hist.push({role: "user", text});
  $("draft").value = "";
  save(); renderChat();

  ui.busy = true; $("sendBtn").disabled = true;
  const reply = await getReply(c, hist.slice());
  hist.push({role: "assistant", text: reply});
  save();
  ui.busy = false; $("sendBtn").disabled = false;
  if (ui.chatId === c.id) renderChat();
}

async function getReply(c, hist){
  const p = db.provider;
  const key = (db.keys[p] || "").trim();
  if (!key) return `⚠ Нет ключа для «${P[p].name}». Открой Настройки и вставь ключ.`;
  const model = (db.models[p] || P[p].def || "").trim();
  if (!model) return "⚠ Не указана модель. Открой Настройки и укажи её название.";
  const url = p === "custom" ? (db.customUrl || "").trim() : P[p].url;
  if (!url) return "⚠ Не указан адрес сервера. Открой Настройки.";
  const msgs = hist.filter(m => !m.text.startsWith("⚠"));
  try {
    return await callModel(p, key, model, url, buildPrompt(c), msgs, 600);
  } catch (e) {
    return "⚠ " + e.message;
  }
}

// ---------- Запрос к сервису ----------
async function callModel(p, key, model, url, system, msgs, maxTokens){
  const fmt = P[p].fmt;
  let res, data;

  if (fmt === "openai"){
    res = await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "application/json", "Authorization": "Bearer " + key},
      body: JSON.stringify({
        model, max_tokens: maxTokens,
        messages: [{role: "system", content: system}].concat(msgs.map(m => ({role: m.role, content: m.text})))
      })
    });
  } else if (fmt === "anthropic"){
    res = await fetch(url, {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model, max_tokens: maxTokens, system,
        messages: msgs.map(m => ({role: m.role, content: m.text}))
      })
    });
  } else if (fmt === "gemini"){
    const gurl = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
    res = await fetch(gurl, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        systemInstruction: {parts: [{text: system}]},
        contents: msgs.map(m => ({role: m.role === "assistant" ? "model" : "user", parts: [{text: m.text}]})),
        generationConfig: {maxOutputTokens: maxTokens}
      })
    });
  }

  try { data = await res.json(); } catch (e) { data = {}; }
  if (!res.ok){
    const msg = (data.error && (data.error.message || data.error)) || ("код ошибки " + res.status);
    throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
  }

  let text = "";
  if (fmt === "openai"){
    text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  } else if (fmt === "anthropic"){
    text = (data.content || []).map(i => i.text || "").join("");
  } else if (fmt === "gemini"){
    const parts = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
    text = (parts || []).map(x => x.text || "").join("");
  }
  return (text || "").trim() || "(пустой ответ, попробуй ещё раз)";
}

// ---------- Настройки ----------
function fillSettings(p){
  $("sProvider").value = p;
  $("sKey").value = db.keys[p] || "";
  $("sModel").value = db.models[p] || "";
  $("sModel").placeholder = P[p].def || "название модели";
  $("sUrl").value = db.customUrl || "";
  $("sUrlWrap").hidden = p !== "custom";
  $("sHint").textContent = P[p].hint;
}

function openSettings(){
  const sel = $("sProvider");
  if (!sel.options.length){
    sel.innerHTML = Object.keys(P).map(k => `<option value="${k}">${esc(P[k].name)}</option>`).join("");
    sel.onchange = () => fillSettings(sel.value);
  }
  fillSettings(db.provider);
  $("sStatus").textContent = "";
  $("setModal").hidden = false;
}
function closeSettings(){ $("setModal").hidden = true; }

function readSettings(){
  const p = $("sProvider").value;
  return {p, key: $("sKey").value.trim(), model: $("sModel").value.trim() || P[p].def, url: p === "custom" ? $("sUrl").value.trim() : P[p].url};
}

function saveSettings(){
  const s = readSettings();
  db.provider = s.p;
  db.keys[s.p] = s.key;
  db.models[s.p] = s.model;
  if (s.p === "custom") db.customUrl = s.url;
  if (!save()) return;
  $("sStatus").textContent = "Сохранено. Сервис: " + P[s.p].name;
}

async function testSettings(){
  const s = readSettings();
  if (!s.key){ $("sStatus").textContent = "Введи ключ."; return; }
  if (!s.model){ $("sStatus").textContent = "Укажи модель."; return; }
  if (!s.url){ $("sStatus").textContent = "Укажи адрес сервера."; return; }
  $("sStatus").textContent = "Проверяю...";
  try {
    const answer = await callModel(s.p, s.key, s.model, s.url, "Отвечай коротко.", [{role: "user", text: "Ответь одним словом: работает"}], 200);
    $("sStatus").textContent = "✅ Подключение работает. Ответ: " + answer;
  } catch (e) {
    $("sStatus").textContent = "⚠ " + e.message;
  }
}

render();
</script>
</body>
</html>
